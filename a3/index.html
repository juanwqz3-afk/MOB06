<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Controle de Estoque</h2>
        <p>Produto: Controle de Videogame</p>
        <p class="estoque-disponivel">Disponível no estoque: <strong>3 unidades</strong></p>
        
        <label for="quantidade">Quantidade desejada:</label>
        <input type="number" id="quantidade" min="1" value="1">
        
        <button onclick="verificarEstoque()">Verificar Disponibilidade</button>
        
        <div id="mensagem" class="mensagem"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
