<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - Identificação</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="card">
            <h2>Identificação</h2>
            
            <div class="input-group">
                <label for="nome">Digite seu nome:</label>
                <input type="text" id="nome" placeholder="Seu nome aqui...">
            </div>

            <div class="btn-group">
                <button id="btn-testar" onclick="mensagem()">Testar</button>
                <button id="btn-limpar" onclick="limpar()">Limpar</button>
            </div>

            <!-- Parágrafo de saída para exibir o resultado -->
            <p id="resultado"></p>
        </div>
    </main>

    <!-- Vinculando o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
